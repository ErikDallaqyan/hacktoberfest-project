# Two images: hyur-frontend (nginx + UI) and hyur-backend (FastAPI + Tesseract).
#
# Default: the backend uses the Ollama already running on your machine
# (on a Mac this keeps Apple-GPU acceleration, which Docker can't provide):
#   docker compose up --build          # open http://localhost:8000
#
# Fully containerised, e.g. on a Linux server (add a GPU reservation there if you have one):
#   OLLAMA_URL=http://ollama:11434 docker compose --profile ollama up --build
services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: hyur-frontend:latest
    ports:
      - "${HYUR_PORT:-8000}:8080"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: hyur-backend:latest
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      HYUR_VISION_MODEL: ${HYUR_MODEL:-gemma3:12b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hyur-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.2
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.34.2
    profiles: ["ollama"]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${HYUR_MODEL:-gemma3:12b}"]
    restart: "no"

volumes:
  hyur-data:
  ollama-models:
