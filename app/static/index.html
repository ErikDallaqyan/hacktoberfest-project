<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyur — Menu Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top no-print">
    <div class="brand">
      <span class="logo">հ</span>
      <div>
        <h1>Hyur</h1>
        <p>Menu translation that knows your dishes. Runs on your own machine.</p>
      </div>
    </div>
    <div class="privacy" id="privacy">● Local model · menu never leaves this computer</div>
  </header>

  <main>
    <section class="card no-print" id="setup">
      <h2><span class="step">1</span> Your restaurant</h2>
      <div class="grid">
        <label>House glossary
          <div class="row">
            <select id="glossary"></select>
            <button class="ghost" id="newGlossary" title="Create a glossary for your restaurant">+ New</button>
          </div>
        </label>
        <label>Menu language
          <select id="sourceLang"></select>
        </label>
        <label>Translate into
          <div id="targetLangs" class="chips"></div>
        </label>
        <label>Model
          <select id="model"></select>
        </label>
        <label>Read photos with
          <select id="reader">
            <option value="auto">OCR + model</option>
            <option value="vision">Model vision</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card no-print" id="input">
      <h2><span class="step">2</span> The menu</h2>
      <div class="tabs">
        <button class="tab active" data-tab="photo">Photo</button>
        <button class="tab" data-tab="text">Paste text</button>
      </div>
      <div class="tabpane" data-pane="photo">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" capture="environment" hidden>
          <img id="preview" alt="" hidden>
          <span id="dropHint">Drop a menu photo here, or click to choose one</span>
        </label>
        <button class="link" id="useSample">No menu handy? Use the sample Armenian menu</button>
      </div>
      <div class="tabpane" data-pane="text" hidden>
        <textarea id="menuText" rows="10" placeholder="Paste the menu exactly as written…"></textarea>
      </div>
      <div class="actions">
        <button class="primary" id="extractBtn">Read menu</button>
        <span class="status" id="extractStatus"></span>
      </div>
    </section>

    <section class="card no-print" id="review" hidden>
      <h2><span class="step">3</span> Check what we read</h2>
      <p class="hint">Fix any misread names or prices before translating. Edits are applied as-is.</p>
      <div id="sourceMenu"></div>
      <div class="actions">
        <button class="primary" id="translateBtn">Translate</button>
        <span class="status" id="translateStatus"></span>
      </div>
    </section>

    <section id="results" hidden>
      <div class="results-bar no-print">
        <div class="langtabs" id="langTabs"></div>
        <div class="row">
          <button class="ghost" id="printBtn">Print bilingual menu</button>
          <button class="ghost" id="jsonBtn">Download JSON</button>
        </div>
      </div>
      <article class="menu-sheet" id="sheet"></article>
      <p class="stats no-print" id="stats"></p>
    </section>
  </main>

  <template id="dishTpl">
    <div class="dish">
      <div class="dish-head">
        <div>
          <div class="dish-name"></div>
          <div class="dish-src"></div>
        </div>
        <div class="dish-price"></div>
      </div>
      <div class="dish-desc"></div>
      <div class="dish-meta">
        <span class="tags"></span>
        <span class="gloss"></span>
        <button class="link edit no-print">Correct</button>
      </div>
      <form class="dish-edit no-print" hidden>
        <input name="name" placeholder="Dish name for guests">
        <textarea name="description" rows="2" placeholder="Short description"></textarea>
        <div class="row">
          <button class="primary small" type="submit">Save to house glossary</button>
          <button class="ghost small cancel" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
